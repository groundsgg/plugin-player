name: Java Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reusable:
    uses: groundsgg/.github/.github/workflows/gradle-ci.yml@main
    secrets:
      # Read-only, for resolving Minestom 26.3 (the minestom module): its Maven package is owned
      # by the private groundsgg/minestom fork, and this job's GITHUB_TOKEN is scoped to
      # plugin-player alone. Unset falls back to GITHUB_TOKEN, which works once the package grants
      # this repository read access.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
